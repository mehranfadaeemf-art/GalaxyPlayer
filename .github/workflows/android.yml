name: Build Galaxy Player APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'GalaxyPlayer-source.zip'
      - '.github/workflows/android.yml'
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'

permissions:
  contents: read

concurrency:
  group: galaxy-player-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare project
        shell: bash
        run: |
          if [ -f GalaxyPlayer-source.zip ]; then
            mkdir -p project
            unzip -q GalaxyPlayer-source.zip -d project
            echo "PROJECT_DIR=project" >> "$GITHUB_ENV"
          elif [ -f app/build.gradle.kts ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          else
            echo "Upload GalaxyPlayer-source.zip to the repository root (not inside a folder)."
            exit 1
          fi

      - name: Prepare preinstalled Android SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "Android SDK manager was not found on this runner."
            exit 1
          fi
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Test audio processing and build APK
        run: gradle -p "$PROJECT_DIR" --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug

      - name: Name APK and generate checksum
        shell: bash
        run: |
          mkdir -p output
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" output/GalaxyPlayer-2.0-preview.apk
          cd output
          sha256sum GalaxyPlayer-2.0-preview.apk > SHA256SUMS.txt

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: GalaxyPlayer-debug-APK
          path: output/
          if-no-files-found: error
          retention-days: 7

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GalaxyPlayer-test-reports
          path: |
            project/app/build/reports/tests/
            app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7
